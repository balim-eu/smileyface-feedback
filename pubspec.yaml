name: smileyface_feedback
description: "The feedback of staging builds: testers shake the device and send a message, typed or dictated, and an annotated screenshot together with the state of the app to a URL."
version: 0.1.0
publish_to: none
repository: https://github.com/balim-eu/smileyface-feedback

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  forui: ^0.27.4
  http: ^1.6.0
  http_parser: ^4.1.2
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shake: ^3.0.0
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  speech_to_text_platform_interface: ^2.5.0
  very_good_analysis: ^9.0.0
